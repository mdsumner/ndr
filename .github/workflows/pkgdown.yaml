# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    # GDAL7 needs a newer GDAL than ubuntu-latest has, so build inside a
    # hypertidy/gdal-r-ci image (GDAL, R, pandoc and dev tooling included)
    container:
      image: ghcr.io/hypertidy/gdal-r-full:latest
      options: --user root
    steps:
      - name: Install git and rsync for checkout and deploy
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git rsync

      - uses: actions/checkout@v4

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          Rscript -e '
            remotes::install_deps(
              dependencies = c("Depends", "Imports", "LinkingTo", "Suggests"),
              upgrade = "never"
            )
            remotes::install_cran("pkgdown")
            remotes::install_local(".", upgrade = "never", dependencies = FALSE)
          '

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
