# R CMD check against current GDAL, using the hypertidy/gdal-r-ci images
# (GDAL, PROJ and GEOS built from source; :latest = releases, :dev = GDAL HEAD).
# A failure on :dev only means an upstream GDAL change that has not reached a
# release yet.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  gdal:
    uses: hypertidy/gdal-r-ci/.github/workflows/check-gdal-release.yml@main
